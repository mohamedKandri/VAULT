[package]
name = "vault"
version = "0.1.0"
description = "VAULT - private, local-first personal financial intelligence"
authors = ["Mohamed Kandri"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.1"
thiserror = "2.0.21"
rand = "0.8"
uuid = { version = "1.29.2", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
